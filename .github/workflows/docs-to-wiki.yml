name: Sync docs to wiki

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

concurrency:
  # Never cancel mid-push: a half-pushed wiki state is worse than a queued run.
  group: docs-to-wiki
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Check out wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror docs/ into wiki checkout
        run: rsync -a --delete --exclude=".git" repo/docs/ wiki/

      # Gollum (the wiki engine) treats a .md-suffixed relative link as a
      # literal file path and serves the raw source instead of the
      # rendered page, so links that are correct in docs/ (where GitHub's
      # repo browser needs the real extension) have to lose it here.
      - name: Strip .md extensions from internal links
        run: python3 repo/.github/scripts/strip_md_links.py wiki

      - name: Check for changes
        id: diff
        working-directory: wiki
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # No-op pushes are the loop-breaker against wiki-to-docs.yml: if the
      # wiki already matches docs/ (e.g. it was just the source of this
      # content), there's nothing to commit, no push happens, and no gollum
      # event fires to re-trigger the reverse sync.
      - name: Commit and push to wiki
        if: steps.diff.outputs.changed == 'true'
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync docs/ from ${{ github.sha }}"
          git push origin HEAD:master
