name: Sync wiki to docs

on:
  gollum:
  workflow_dispatch:

concurrency:
  # Serialize so near-simultaneous wiki edits don't race two branches/PRs.
  group: wiki-to-docs
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Mirror wiki into docs/
        run: rsync -a --delete --exclude=".git" wiki/ docs/

      # Undo the extension strip from docs-to-wiki.yml: links need the real
      # .md extension again now that this content is back in docs/, where
      # GitHub's repo browser (unlike the wiki) requires it to resolve.
      - name: Re-add .md extensions to internal links
        run: python3 .github/scripts/add_md_links.py docs

      # Empty diff means the wiki's current content already matches docs/ on
      # main (e.g. because docs-to-wiki.yml just pushed it there) -- this is
      # the loop-breaker against that workflow, and it also means we never
      # try to assign a PR to github-actions[bot] in the loop-trigger case.
      - name: Check for changes
        id: diff
        run: |
          if git status --porcelain -- docs/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Sync docs/ from wiki"
          branch: wiki-sync/docs-update
          title: "Sync docs/ from wiki edits"
          body: "Automated sync of wiki page changes into docs/, triggered by a wiki edit."
          assignees: ${{ github.actor }}
          delete-branch: true
